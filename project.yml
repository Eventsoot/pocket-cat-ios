name: PocketCat
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    DEVELOPMENT_TEAM: ''
targets:
  PocketCat:
    type: application
    platform: iOS
    sources: [App, Shared, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PocketCat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Мурчик
        CFBundleShortVersionString: '2.0'
        CFBundleVersion: '2'
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: App/PocketCat.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.PocketCat]
    dependencies:
      - target: PocketCatWidgets
  PocketCatWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PocketCat.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Мурчик
        CFBundleShortVersionString: '2.0'
        CFBundleVersion: '2'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/PocketCatWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.PocketCat]
schemes:
  PocketCat:
    build:
      targets:
        PocketCat: all
